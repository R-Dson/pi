name: Fork Release

# Manual fork-only release to GitHub Packages (npm.pkg.github.com). Never runs on
# push/PR. Publishes all public workspace packages as @r-dson/* at a publish-time
# version, then tags v<version> and creates a GitHub Release. Repo files (manifests,
# changelogs) are never modified; the only git object created is the tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version; empty = <upstream-version>-fork.<run number>'
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORK_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Build
        run: npm run build

      - name: Compute release version
        id: version
        run: |
          set -euo pipefail

          if [[ -n "${FORK_VERSION_INPUT}" ]]; then
            VERSION="${FORK_VERSION_INPUT}"
          else
            VERSION="$(node -p 'require("./packages/coding-agent/package.json").version')-fork.${{ github.run_number }}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Publish packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          FORK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "${FORK_VERSION_INPUT}" ]]; then
            node scripts/fork-publish-github.mjs --version "$FORK_VERSION"
          else
            node scripts/fork-publish-github.mjs --auto "${{ github.run_number }}"
          fi

      - name: Tag release
        env:
          FORK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          VERSION="$FORK_VERSION"
          TAG="v${VERSION}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi

          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          VERSION="$FORK_VERSION"
          TAG="v${VERSION}"

          jq -r '.packages[] | "- \\(.name)@\\(.version) (\\(.outcome))"' .fork-publish/summary.json > release-packages.md
          {
            echo "Fork release ${TAG}."
            echo
            echo "Published to the GitHub Packages npm registry (scope \`@r-dson\`):"
            echo
            cat release-packages.md
            echo
            echo "Install instructions: [\`docs/fork/install-from-github.md\`](docs/fork/install-from-github.md)"
          } > RELEASE_NOTES.md

          gh release create "${TAG}" \
            --verify-tag \
            --title "${TAG}" \
            --notes-file RELEASE_NOTES.md
